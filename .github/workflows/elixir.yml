name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  MIX_ENV: test

jobs:
  # Latest stable Elixir/OTP and deps — runs the full quality gate
  # (ADR-008).
  latest:
    name: latest (mix check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: deps-latest-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-latest-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Cache _build
        uses: actions/cache@v5
        with:
          path: _build
          key: build-latest-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: build-latest-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Cache dialyzer PLT
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: plt-latest-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: plt-latest-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get
      - run: mix check

  # Floor Elixir/OTP (ADR-008) with the lowest dep versions those floors
  # resolve to. Full suite, no quality gate.
  oldest:
    name: oldest (floor Elixir/OTP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "26.2"

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: deps-oldest-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-oldest-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Cache _build
        uses: actions/cache@v5
        with:
          path: _build
          key: build-oldest-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: build-oldest-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      # Re-resolve against the floor toolchain rather than trusting the
      # `latest`-leg lockfile, so an accidental use of a newer-than-floor
      # API fails here instead of in a consumer's app (ADR-008).
      - run: rm -f mix.lock
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  # `ash`/`ash_phoenix` excluded entirely (ADR-006, ADR-008): compiles
  # `--warnings-as-errors` and runs the core suite with Ash-tagged tests
  # skipped, keeping the optional-dependency boundary honest.
  no-ash:
    name: no-ash (core only)
    runs-on: ubuntu-latest
    env:
      FLICKER_NO_ASH: "true"
    steps:
      - uses: actions/checkout@v6

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: deps-no-ash-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-no-ash-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - name: Cache _build
        uses: actions/cache@v5
        with:
          path: _build
          key: build-no-ash-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: build-no-ash-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test --exclude ash

  # Spec 007's browser-driven suite: axe-core scans + client-side keyboard
  # behaviour (arrow-key highlight, mod+k, focus trap, windowed-search
  # load-more) that ExUnit/PhoenixTest can't reach, run against a real
  # Chrome via Wallaby/chromedriver against `Dev.Endpoint` over real HTTP
  # (see `test/support/browser_case.ex`). `@moduletag :browser`, excluded
  # from every other job's plain `mix test`/`mix check` run.
  browser:
    name: browser (axe-core + keyboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: deps-latest-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-latest-${{ runner.os }}-${{ steps.beam.outputs.elixir-version }}-${{ steps.beam.outputs.otp-version }}-

      - run: mix deps.get

      # Install a matched pair and pass the exact driver path to Wallaby;
      # hosted runners can have a different preinstalled driver on `PATH`.
      - name: Install Chrome for Testing + matching chromedriver
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - run: mix test --only browser
        env:
          WALLABY_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          WALLABY_CHROMEDRIVER_PATH: ${{ steps.chrome.outputs.chromedriver-path }}

  docs:
    name: Build HexDocs
    needs: latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix deps.get
      - run: mix docs

  release:
    name: git_ops.release
    needs: latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release-check
        name: Check release eligibility
        shell: bash
        run: |
          git fetch origin main --tags

          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; skipping this stale release."
          elif [[ -z "$(git tag --list 'v*')" ]]; then
            echo "No release baseline tag exists; run the initial release manually."
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.release-check.outputs.eligible == 'true' }}
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - if: ${{ steps.release-check.outputs.eligible == 'true' }}
        run: mix deps.get

      - name: git-ops release
        if: ${{ steps.release-check.outputs.eligible == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mix git_ops.release --yes
          git push --follow-tags
